<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar | Dompet Mahasiswa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f7fc; }
    .card-auth { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; border: 1px solid #eef0f7; }
    .card-auth h2 { margin-bottom: 6px; font-size: 22px; }
    .card-auth form { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card-auth input { width: 100%; padding: 12px; border: 1px solid #e5e9f2; border-radius: 9px; outline: none; }
    .card-auth button { width: 100%; background: #6b55eb; color: white; border: none; padding: 12px; border-radius: 9px; font-weight: 700; cursor: pointer; }
    .card-auth button:hover { background: #5741d8; }
  </style>
</head>
<body>
  <div class="card-auth">
    <h2>📝 Daftar Akun</h2>
    <p class="muted">Buat akun untuk menyimpan transaksi Anda</p>
    
    {% if error %}
      <p style="color: #ee6c7a; font-size: 13px; font-weight: 600; margin-top: 10px;">{{ error }}</p>
    {% endif %}

    <form action="/register" method="POST">
      <label>Username / Email
        <input type="text" name="username" placeholder="Contoh: mahasiswa1" required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Buat password" required>
      </label>
      <button type="submit">Daftar Sekarang</button>
    </form>
    <p style="font-size: 13px; margin-top: 20px; text-align: center; color: #77839a;">
      Sudah punya akun? <a href="/login" style="color: #6b55eb; font-weight: 700; text-decoration: none;">Login di sini</a>
    </p>
  </div>
</body>
</html>
